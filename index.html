<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Food & Water Locator</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        .leaflet-control-attribution a[href*="leafletjs.com"] {
            background-image: none !important;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-title h1 {
            font-size: 1.4rem;
            margin: 0;
        }
        .header-title p {
            font-size: 0.85rem;
            margin: 2px 0 0 0;
            color: #bdc3c7;
        }
        .search-container {
            display: flex;
            gap: 6px;
        }
        .search-container input {
            padding: 6px 10px;
            width: 200px;
            border-radius: 4px;
            border: none;
            font-size: 0.9rem;
        }
        .search-container button {
            padding: 6px 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-container button:hover {
            background-color: #219653;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }

        /* Responsive layout for mobile devices */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            .search-container {
                width: 100%;
                justify-content: center;
            }
            .search-container input {
                width: 70%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Food & Water Locator</h1>
            <p>Find nearby pantries and clean water sources instantly</p>
        </div>
        
        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="zipInput" placeholder="Enter US ZIP or City...">
            <button onclick="searchLocation()">Search</button>
        </div>
    </header>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Initialize map centered around Irving, TX
        var map = L.map('map').setView([32.8140, -96.9489], 12);

        // 2. Public OpenStreetMap tile layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Global variable to store active search perimeter shape
        var searchRectangle = null;

        // 3. Sample List of Food Pantries & Water Stations
        var locations = [
            {
                name: "Irving Cares Food Pantry",
                lat: 32.8105,
                lng: -96.9535,
                type: "Food & Water",
                hours: "Mon-Fri: 9am - 3pm"
            },
            {
                name: "Community Water Station",
                lat: 32.8300,
                lng: -96.9600,
                type: "Water Refill",
                hours: "24/7"
            }
        ];

        // 4. Add Pin Markers to the Map
        locations.forEach(function(place) {
            var marker = L.marker([place.lat, place.lng]).addTo(map);
            marker.bindPopup(
                '<b>' + place.name + '</b><br>' +
                '<strong>Type:</strong> ' + place.type + '<br>' +
                '<strong>Hours:</strong> ' + place.hours
            );
        });

        // 5. Search Location Function with Perimeter & Auto-Zoom
        function searchLocation() {
            var query = document.getElementById('zipInput').value;
            if (!query) {
                alert("Please enter a US ZIP code or city.");
                return;
            }

            var searchUrl = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query + ', USA');

            fetch(searchUrl)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        var result = data[0];
                        
                        // Extract bounding box coordinates [latmin, latmax, lonmin, lonmax]
                        var bbox = result.boundingbox;
                        var southWest = L.latLng(parseFloat(bbox[0]), parseFloat(bbox[2]));
                        var northEast = L.latLng(parseFloat(bbox[1]), parseFloat(bbox[3]));
                        var bounds = L.latLngBounds(southWest, northEast);

                        // Remove previous search outline if it exists
                        if (searchRectangle) {
                            map.removeLayer(searchRectangle);
                        }

                        // Draw the dark blue outline with light blue fill inside
                        searchRectangle = L.rectangle(bounds, {
                            color: "#1b365d",     // Dark blue outline
                            weight: 3,
                            fillColor: "#4a90e2", // Lighter blue fill
                            fillOpacity: 0.25     // Semi-transparent
                        }).addTo(map);

                        // Automatically zoom and center map to fit the area bounds
                        map.fitBounds(bounds);

                        // Optional info popup at center
                        L.popup()
                            .setLatLng(map.getCenter())
                            .setContent("<b>Area:</b> " + result.display_name)
                            .openOn(map);

                    } else {
                        alert("Location not found in the US. Please try a valid ZIP code or city.");
                    }
                })
                .catch(error => {
                    console.error('Error fetching location:', error);
                    alert("Error connecting to search service.");
                });
        }
    </script>
</body>
</html>
