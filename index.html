<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Food & Water Locator - By Aishwarya Reddy Nalla</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        .leaflet-control-attribution a[href*="leafletjs.com"] {
            background-image: none !important;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-title h1 {
            font-size: 1.4rem;
            margin: 0;
        }
        .header-title p {
            font-size: 0.85rem;
            margin: 2px 0 0 0;
            color: #bdc3c7;
        }
        .search-container {
            display: flex;
            gap: 6px;
        }
        .search-container input {
            padding: 6px 10px;
            width: 200px;
            border-radius: 4px;
            border: none;
            font-size: 0.9rem;
        }
        .search-container button {
            padding: 6px 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-container button:hover {
            background-color: #219653;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }

        /* Responsive layout for mobile devices */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            .search-container {
                width: 100%;
                justify-content: center;
            }
            .search-container input {
                width: 70%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Food & Water Locator</h1>
            <p>Find nearby pantries and clean water sources instantly</p>
        </div>
        
        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="zipInput" placeholder="Enter US ZIP or City...">
            <button onclick="searchLocation()">Search</button>
        </div>
    </header>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Initialize map centered around Irving, TX
        var map = L.map('map').setView([32.8140, -96.9489], 12);

        // 2. Public OpenStreetMap tile layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Global variables to store active search circle and dynamic markers layer group
        var searchCircle = null;
        var markersLayer = L.layerGroup().addTo(map);

        // 3. Search Location Function with 5-Mile Circle & Real-Time Overpass API Data
        function searchLocation() {
            var query = document.getElementById('zipInput').value;
            if (!query) {
                alert("Please enter a US ZIP code or city.");
                return;
            }

            var searchUrl = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query + ', USA');

            fetch(searchUrl)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        var result = data[0];
                        var lat = parseFloat(result.lat);
                        var lon = parseFloat(result.lon);
                        var center = [lat, lon];

                        // Remove previous search circle if it exists
                        if (searchCircle) {
                            map.removeLayer(searchCircle);
                        }

                        // Draw a 5-mile radius search circle (8046 meters)
                        searchCircle = L.circle(center, {
                            radius: 8046,
                            color: "#1b365d",
                            weight: 2,
                            fillColor: "#4a90e2",
                            fillOpacity: 0.2
                        }).addTo(map);

                        // Zoom map neatly to fit the circle
                        map.fitBounds(searchCircle.getBounds());

                        // Fetch real food and water locations inside this 5-mile radius from Overpass API
                        fetchOverpassData(lat, lon, 8046);

                    } else {
                        alert("Location not found in the US. Please try a valid ZIP code or city.");
                    }
                })
                .catch(error => {
                    console.error('Error fetching location:', error);
                    alert("Error connecting to search service.");
                });
        }

        // 4. Function to query OpenStreetMap via Overpass API
        function fetchOverpassData(lat, lon, radiusMeters) {
            // Clear old markers
            markersLayer.clearLayers();

            // Overpass query for food banks, pantries, social facilities, and drinking water within radius
            var overpassQuery = `
                [out:json][timeout:25];
                (
                  node["amenity"="social_facility"]["social_facility"="food_bank"](around:${radiusMeters},${lat},${lon});
                  way["amenity"="social_facility"]["social_facility"="food_bank"](around:${radiusMeters},${lat},${lon});
                  node["amenity"="food_pantry"](around:${radiusMeters},${lat},${lon});
                  way["amenity"="food_pantry"](around:${radiusMeters},${lat},${lon});
                  node["amenity"="drinking_water"](around:${radiusMeters},${lat},${lon});
                  way["amenity"="drinking_water"](around:${radiusMeters},${lat},${lon});
                  node["amenity"="water_point"](around:${radiusMeters},${lat},${lon});
                );
                out body;
                >;
                out skel qt;
            `;

            var url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(overpassQuery);

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data && data.elements && data.elements.length > 0) {
                        data.elements.forEach(element => {
                            if (element.lat && element.lon) {
                                var name = (element.tags && element.tags.name) ? element.tags.name : "Community Resource";
                                var type = "Food / Water Resource";
                                if (element.tags && element.tags.amenity === "drinking_water") {
                                    type = "Drinking Water";
                                } else if (element.tags && element.tags.social_facility === "food_bank") {
                                    type = "Food Bank / Pantry";
                                }

                                var marker = L.marker([element.lat, element.lon]);
                                marker.bindPopup(
                                    '<b>' + name + '</b><br>' +
                                    '<strong>Type:</strong> ' + type + '<br>' +
                                    '<em>Fetched from OpenStreetMap</em>'
                                );
                                markersLayer.addLayer(marker);
                            }
                        });
                    } else {
                        // Fallback message if no tagged resources are returned in that specific rural/suburban pocket
                        L.popup()
                            .setLatLng([lat, lon])
                            .setContent("<b>Search Center:</b> " + query + "<br><i>No specific tagged food/water nodes found in this exact 5mi radius. Try a major metro area!</i>")
                            .openOn(map);
                    }
                })
                .catch(error => {
                    console.error('Error fetching Overpass data:', error);
                });
        }
    </script>
</body>
</html>
