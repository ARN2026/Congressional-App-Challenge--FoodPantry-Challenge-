<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Food & Water Locator - By Aishwarya Reddy Nalla</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        .leaflet-control-attribution a[href*="leafletjs.com"] {
            background-image: none !important;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-title h1 {
            font-size: 1.4rem;
            margin: 0;
        }
        .header-title p {
            font-size: 0.85rem;
            margin: 2px 0 0 0;
            color: #bdc3c7;
        }
        .search-container {
            display: flex;
            gap: 6px;
        }
        .search-container input {
            padding: 6px 10px;
            width: 200px;
            border-radius: 4px;
            border: none;
            font-size: 0.9rem;
        }
        .search-container button {
            padding: 6px 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-container button:hover {
            background-color: #219653;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }

        /* Responsive layout for mobile devices */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            .search-container {
                width: 100%;
                justify-content: center;
            }
            .search-container input {
                width: 70%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Food & Water Locator</h1>
            <p>Find nearby pantries and clean water sources instantly</p>
        </div>
        
        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="zipInput" placeholder="Enter US ZIP or City...">
            <button onclick="searchLocation()">Search</button>
        </div>
    </header>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Initialize map centered around Irving, TX
        var map = L.map('map').setView([32.8140, -96.9489], 12);

        // 2. Public OpenStreetMap tile layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Global variables to store active search circle and dynamic markers layer group
        var searchCircle = null;
        var markersLayer = L.layerGroup().addTo(map);

        // 3. Search Location Function with 5-Mile Circle & Real-Time Overpass API Data
        function searchLocation() {
            var query = document.getElementById('zipInput').value;
            if (!query) {
                alert("Please enter a US ZIP code or city.");
                return;
            }

            var searchUrl = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query + ', USA');

            fetch(searchUrl)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        var result = data[0];
                        var lat = parseFloat(result.lat);
                        var lon = parseFloat(result.lon);
                        var center = [lat, lon];

                        // Remove previous search circle if it exists
                        if (searchCircle) {
                            map.removeLayer(searchCircle);
                        }

                        // Draw a 5-mile radius search circle (8046 meters)
                        searchCircle = L.circle(center, {
                            radius: 8046,
                            color: "#1b365d",
                            weight: 2,
                            fillColor: "#4a90e2",
                            fillOpacity: 0.2
                        }).addTo(map);

                        // Zoom map neatly to fit the circle
                        map.fitBounds(searchCircle.getBounds());

                        // Show center search popup with loading notice
                        L.popup()
                            .setLatLng(center)
                            .setContent("<b>Searched area for:</b> " + query + "<br><i>Fetched within 5 miles</i><br><span style='color: #e67e22; font-weight: bold;'>Please wait for results to load!</span>")
                            .openOn(map);

                        // Fetch real resources inside this 5-mile radius
                        fetchOverpassData(lat, lon, 8046);

                    } else {
                        alert("Location not found in the US. Please try a valid ZIP code or city.");
                    }
                })
                .catch(error => {
                    console.error('Error fetching location:', error);
                    alert("Error connecting to search service.");
                });
        }

        // 4. Function to query OpenStreetMap via Overpass API using NWR (Nodes, Ways, Relations)
        function fetchOverpassData(lat, lon, radiusMeters) {
            markersLayer.clearLayers();

            var overpassQuery = `
                [out:json][timeout:25];
                (
                  nwr["amenity"="social_facility"](around:${radiusMeters},${lat},${lon});
                  nwr["social_facility"="food_bank"](around:${radiusMeters},${lat},${lon});
                  nwr["amenity"="food_pantry"](around:${radiusMeters},${lat},${lon});
                  nwr["amenity"="drinking_water"](around:${radiusMeters},${lat},${lon});
                  nwr["amenity"="water_point"](around:${radiusMeters},${lat},${lon});
                  nwr["amenity"="shelter"](around:${radiusMeters},${lat},${lon});
                  nwr["shop"="supermarket"](around:${radiusMeters},${lat},${lon});
                  nwr["shop"="convenience"](around:${radiusMeters},${lat},${lon});
                );
                out body center;
            `;

            var url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(overpassQuery);

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data && data.elements && data.elements.length > 0) {
                        data.elements.forEach(element => {
                            var elLat = element.lat || (element.center ? element.center.lat : null);
                            var elLon = element.lon || (element.center ? element.center.lon : null);

                            if (elLat && elLon) {
                                var tags = element.tags || {};
                                
                                var service = "Community Resource";
                                var defaultName = "Public Community Facility";

                                if (tags.amenity === "drinking_water" || tags.amenity === "water_point") {
                                    service = "Water";
                                    defaultName = "Public Drinking Water Station";
                                } else if (tags.amenity === "food_pantry" || tags.social_facility === "food_bank") {
                                    service = "Food";
                                    defaultName = "Community Food Pantry / Bank";
                                } else if (tags.shop === "supermarket" || tags.shop === "convenience") {
                                    service = "Food";
                                    defaultName = "Local Grocery / Supermarket";
                                } else if (tags.amenity === "shelter" || tags.social_facility === "shelter") {
                                    service = "Shelter";
                                    defaultName = "Community Shelter";
                                }

                                var name = tags.name ? tags.name : defaultName;
                                
                                var houseNo = tags["addr:housenumber"] || "";
                                var street = tags["addr:street"] || "";
                                var city = tags["addr:city"] || "";
                                var state = tags["addr:state"] || "";
                                var postcode = tags["addr:postcode"] || "";
                                
                                var address = (houseNo ? houseNo + " " : "") + street + (city ? ", " + city : "") + (state ? ", " + state : "") + (postcode ? " " + postcode : "");
                                if (!street) {
                                    address = "GPS Location (Tap walking directions below)";
                                }

                                // Force walking mode directly in the Google Maps URL
                                var navUrl = "https://www.google.com/maps/dir/?api=1&destination=" + elLat + "," + elLon + "&travelmode=walking";

                                var marker = L.marker([elLat, elLon]);
                                marker.bindPopup(
                                    '<b>Name:</b> ' + name + '<br>' +
                                    '<b>Address:</b> ' + address + '<br>' +
                                    '<b>Location:</b> ' + elLat.toFixed(5) + ', ' + elLon.toFixed(5) + '<br>' +
                                    '<b>Service:</b> ' + service + '<br>' +
                                    '<a href="' + navUrl + '" target="_blank" style="color: #27ae60; font-weight: bold; text-decoration: underline;">Open Walking Directions</a>'
                                );
                                markersLayer.addLayer(marker);
                            }
                        });
                    }
                })
                .catch(error => {
                    console.error('Error fetching Overpass data:', error);
                });
        }
    </script>
</body>
</html>
