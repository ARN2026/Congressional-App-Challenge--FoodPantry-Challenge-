<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food & Water Locator</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 1000;
        }
        .header-title h1 {
            font-size: 1.3rem;
            margin: 0;
        }
        .header-title p {
            font-size: 0.8rem;
            margin: 2px 0 0 0;
            color: #bdc3c7;
        }
        .search-container {
            display: flex;
            gap: 6px;
        }
        .search-container input {
            padding: 8px 10px;
            width: 200px;
            border-radius: 4px;
            border: none;
            font-size: 0.9rem;
        }
        .search-container button {
            padding: 8px 14px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-container button:hover {
            background-color: #219653;
        }
        #map {
            flex-grow: 1;
            height: 100%;
            width: 100%;
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            .search-container {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Food & Water Locator</h1>
            <p>Find nearby pantries and clean water sources instantly</p>
        </div>
        
        <div class="search-container">
            <input type="text" id="zipInput" placeholder="Enter US ZIP or City...">
            <button onclick="searchLocation()">Search</button>
        </div>
    </header>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize map centered around Irving, TX
        var map = L.map('map').setView([32.8140, -96.9489], 12);

        // Standard OpenStreetMap Tile Layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var searchCircle = null;
        var markersLayer = L.layerGroup().addTo(map);

        function searchLocation() {
            var query = document.getElementById('zipInput').value.trim();
            if (!query) {
                alert("Please enter a US ZIP code or city.");
                return;
            }

            var searchUrl = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query + ', USA');

            fetch(searchUrl)
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data && data.length > 0) {
                        var lat = parseFloat(data[0].lat);
                        var lon = parseFloat(data[0].lon);
                        var center = [lat, lon];

                        if (searchCircle) {
                            map.removeLayer(searchCircle);
                        }

                        // Draw 5-mile radius (8046 meters)
                        searchCircle = L.circle(center, {
                            radius: 8046,
                            color: "#1b365d",
                            weight: 2,
                            fillColor: "#4a90e2",
                            fillOpacity: 0.2
                        }).addTo(map);

                        map.fitBounds(searchCircle.getBounds());

                        L.popup()
                            .setLatLng(center)
                            .setContent("<b>Searched area:</b> " + query + "<br>Fetched within a radius of 5 miles")
                            .openOn(map);

                        fetchOverpassData(lat, lon, 8046);

                    } else {
                        alert("Location not found. Please try a valid US ZIP code or city.");
                    }
                })
                .catch(function(error) {
                    console.error('Error fetching location:', error);
                    alert("Error connecting to search service.");
                });
        }

        function fetchOverpassData(lat, lon, radiusMeters) {
            markersLayer.clearLayers();

            var overpassQuery = '[out:json][timeout:25];(' +
                'node["amenity"="food_pantry"](around:' + radiusMeters + ',' + lat + ',' + lon + ');' +
                'node["social_facility"="food_bank"](around:' + radiusMeters + ',' + lat + ',' + lon + ');' +
                'node["amenity"="drinking_water"](around:' + radiusMeters + ',' + lat + ',' + lon + ');' +
                'node["amenity"="shelter"](around:' + radiusMeters + ',' + lat + ',' + lon + ');' +
                'node["amenity"="place_of_worship"](around:' + radiusMeters + ',' + lat + ',' + lon + ');' +
                ');out body;';

            var url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(overpassQuery);

            fetch(url)
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data && data.elements && data.elements.length > 0) {
                        data.elements.forEach(function(element) {
                            if (element.lat && element.lon) {
                                var tags = element.tags || {};
                                var name = tags.name || "Community Resource";
                                var amenity = tags.amenity || "facility";
                                
                                var navUrl = "https://www.google.com/maps/dir/?api=1&destination=" + element.lat + "," + element.lon + "&travelmode=walking";

                                var marker = L.marker([element.lat, element.lon]);
                                marker.bindPopup(
                                    '<b>' + name + '</b><br>' +
                                    'Type: ' + amenity + '<br>' +
                                    '<a href="' + navUrl + '" target="_blank" style="color: #27ae60; font-weight: bold;">Walking Directions</a>'
                                );
                                markersLayer.addLayer(marker);
                            }
                        });
                    } else {
                        console.log("No nodes found in this radius.");
                    }
                })
                .catch(function(error) {
                    console.error('Error fetching Overpass data:', error);
                });
        }
    </script>
</body>
</html>
